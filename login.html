<!DOCTYPE html>
<html>
<head>
    <title>SQLi Demo Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }
        .box {
            width: 100%;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="box">
    <form method="POST">
        <h3>Login</h3>
        Username:
        <input type="text" name="username">
        Password:
        <input type="text" name="password">
        <input type="submit" name="login" value="Login">
    </form>
</div>

</body>
</html>
